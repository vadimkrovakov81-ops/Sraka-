<script>
'use strict';
const $=id=>document.getElementById(id),T=THREE;
const renderer=new T.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene();scene.background=new T.Color(0x8fd3ff);scene.fog=new T.Fog(0xbfe6ff,50,150);
const cam=new T.PerspectiveCamera(60,1,.1,300);
const hemi=new T.HemisphereLight(0xffffff,0x6aa84f,.9);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff2c0,.9);sun.position.set(-8,15,6);scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();

const mats={};const M=(c,o={})=>mats[c+JSON.stringify(o)]||(mats[c+JSON.stringify(o)]=new T.MeshLambertMaterial(Object.assign({color:c},o)));
function box(w,h,d,c,x=0,y=0,z=0,p){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(p||scene).add(m);return m}
function cyl(rt,rb,h,c,x,y,z,seg=12){const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg),M(c));m.position.set(x,y,z);return m}
function sph(r,c,x,y,z,sx=1,sy=1,sz=1){const m=new T.Mesh(new T.SphereGeometry(r,20,16),M(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m}

// ---------- ЦЫПА (по картинке, вид со спины) ----------
function tex(base,strokes,w=256,alpha=false){const c=document.createElement('canvas');c.width=c.height=w;const x=c.getContext('2d');
 if(!alpha){x.fillStyle=base;x.fillRect(0,0,w,w)}
 for(const [col,n,len,lw] of strokes){x.strokeStyle=col;x.lineWidth=lw;for(let i=0;i<n;i++){const px=Math.random()*w,py=Math.random()*w,a=Math.PI/2+(Math.random()-.5)*.8;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*len,py+Math.sin(a)*len);x.stroke()}}
 const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;return t}
const furTex=tex('#f5a21c',[['#ffc54d',2200,12,1.6],['#e8861a',1500,10,1.3],['#ffd873',800,9,1]]);furTex.repeat.set(3,2);
const fuzzTex=tex(0,[['rgba(255,190,70,.95)',900,16,1.8],['rgba(240,140,25,.9)',500,14,1.5]],256,true);fuzzTex.repeat.set(3,2);
const shellTex=tex('#e3b98c',[['#cf9f72',700,5,3],['#f0d1ab',500,6,2]]);
{const x=shellTex.image.getContext('2d');x.fillStyle='#b98a60';for(let i=0;i<40;i++){x.beginPath();x.ellipse(Math.random()*256,Math.random()*256,3+Math.random()*4,2+Math.random()*3,0,0,6.3);x.fill()}shellTex.needsUpdate=true}
const furM=new T.MeshLambertMaterial({map:furTex});
const chick=new T.Group(),body=new T.Group(),model=new T.Group();chick.add(model);model.add(body);
const BY=1.0;
const core=new T.Mesh(new T.SphereGeometry(.66,32,24),furM);core.position.y=BY;core.scale.set(1.05,1,.97);body.add(core);
for(let i=1;i<=4;i++){const l=new T.Mesh(new T.SphereGeometry(.66+i*.022,28,20),new T.MeshLambertMaterial({map:fuzzTex,transparent:true,alphaTest:.08,depthWrite:false}));l.position.y=BY;l.scale.set(1.05,1,.97);body.add(l)}
// ворс по контуру
const cm=[0xf6a31c,0xffbf45,0xe8861a].map(c=>M(c));
for(let i=0;i<170;i++){const u=Math.random()*6.283,v=Math.acos(2*Math.random()-1);if(Math.cos(v)<-.35)continue;
 const n=new T.Vector3(Math.sin(v)*Math.cos(u)*1.05,Math.cos(v),Math.sin(v)*Math.sin(u)*.97);const t=new T.Mesh(new T.ConeGeometry(.045,.2+Math.random()*.12,4),cm[i%3]);
 t.position.copy(n).multiplyScalar(.68).add(new T.Vector3(0,BY,0));t.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),n.clone().normalize());body.add(t)}
// скорлупа
const shell=new T.Mesh(new T.SphereGeometry(.72,36,18,0,6.283,1.78,1.36),new T.MeshLambertMaterial({map:shellTex,side:T.DoubleSide}));shell.position.y=.9;shell.scale.set(1.04,1,1);body.add(shell);
const rimR=.72*Math.sin(1.78)*1.04,rimY=.9+.72*Math.cos(1.78);
for(let i=0;i<22;i++){const a=i/22*6.283,t=new T.Mesh(new T.ConeGeometry(.085,.2,3),new T.MeshLambertMaterial({map:shellTex}));t.position.set(Math.cos(a)*rimR,rimY+.07,Math.sin(a)*rimR*.98);t.rotation.y=-a;t.rotation.x=0;body.add(t)}
// хохолок
[[-.06,.62,.1,.5],[.02,.78,0,.12],[.12,.66,-.05,-.55]].forEach(([x,h,z,r],i)=>{const g=new T.Group();const f=new T.Mesh(new T.ConeGeometry(.045,h,5),M(0xffa726));f.position.y=h/2;g.add(f);const tip=new T.Mesh(new T.ConeGeometry(.03,h*.4,5),M(0xffc54d));tip.position.set(Math.sin(r)*.05,h*.95,0);tip.rotation.z=-r*.6;g.add(tip);g.position.set(x,BY+.6,z);g.rotation.z=-r*.55;g.rotation.x=-.15;body.add(g)});
// лицо (видно в меню)
const face=new T.Group();[-.26,.26].forEach(x=>{face.add(sph(.215,0xffffff,x,1.14,.56,1,1.05,.55),sph(.125,0x3b9de8,x,1.14,.72,1,1,.35),sph(.065,0x0b1a2a,x,1.14,.78,1,1,.3),sph(.03,0xffffff,x+.03,1.18,.82,1,1,.3))});
const bk=new T.Mesh(new T.ConeGeometry(.07,.14,6),M(0xf06a1a));bk.rotation.x=Math.PI/2;bk.position.set(0,.98,.68);face.add(bk);
[-.26,.26].forEach(x=>{const b=box(.2,.025,.03,0xd9741a,x,1.4,.6,face);b.rotation.z=x<0?-.25:.25});body.add(face);
// полицейский наряд (показывается во время бонуса)
const outfit=new T.Group();
outfit.add(cyl(.5,.6,.2,0x1a2f6b,0,1.63,0,24),cyl(.66,.52,.16,0x16347f,0,1.76,0,24));
{const br=box(.78,.05,.42,0x0d1a3d,0,1.55,.62,outfit);br.rotation.x=.12;const bd=sph(.1,0xffd54f,0,1.72,.6,1,1.2,.3);outfit.add(bd);outfit.add(cyl(.5,.5,.04,0xffd54f,0,1.665,0,24))}
[-.26,.26].forEach(x=>outfit.add(sph(.25,0x0a0a0a,x,1.14,.7,1,.85,.35),box(.04,.04,.75,0x0a0a0a,x*2.05,1.17,.25,outfit)));
box(.2,.05,.05,0x0a0a0a,0,1.17,.8,outfit);outfit.visible=false;body.add(outfit);
// хвостик
for(let i=0;i<5;i++){const t=new T.Mesh(new T.ConeGeometry(.05,.3,5),M(i%2?0xffb53d:0xf6a31c));t.position.set((i-2)*.07,.8+(i%2)*.06,-.68);t.rotation.x=-1.9;t.rotation.z=(i-2)*.2;body.add(t)}
// крылья
function mkWing(s){const w=new T.Group();const m=new T.Mesh(new T.SphereGeometry(.3,18,14),furM);m.scale.set(.32,1.5,.75);m.position.set(s*.08,-.32,0);w.add(m);
 for(let i=0;i<4;i++){const f=new T.Mesh(new T.ConeGeometry(.07,.28,4),M(i%2?0xffb53d:0xf29a1c));f.position.set(s*(.07+(i-1.5)*.02),-.72,(i-1.5)*.1);f.rotation.x=Math.PI;f.rotation.z=(i-1.5)*.1;w.add(f)}
 w.position.set(s*.7,1.15,0);return w}
const wingL=mkWing(-1),wingR=mkWing(1);body.add(wingL,wingR);
// ноги: бедро -> голень -> стопа с 3 пальцами
const legM=M(0xf08a1a);
const legs=[-.2,.2].map(x=>{const hip=new T.Group();hip.position.set(x,.42,0);hip.add(cyl(.032,.028,.26,0xf08a1a,0,-.13,0,6));
 const knee=new T.Group();knee.position.y=-.26;knee.add(cyl(.028,.025,.26,0xf08a1a,0,-.13,0,6));
 const foot=new T.Group();foot.position.y=-.26;[-.12,0,.12].forEach((a,i)=>{const t=new T.Mesh(new T.BoxGeometry(.05,.03,.26),legM);t.position.set(a*.7,.01,-.1);t.rotation.y=a*1.3;foot.add(t)});
 const heel=new T.Mesh(new T.BoxGeometry(.07,.03,.08),legM);heel.position.set(0,.01,.02);foot.add(heel);knee.add(foot);hip.add(knee);hip.knee=knee;hip.foot=foot;model.add(hip);return hip});
const blob=new T.Mesh(new T.CircleGeometry(.7,20),new T.MeshBasicMaterial({color:0,transparent:true,opacity:.28,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.y=.03;scene.add(blob);
model.rotation.y=0;
scene.add(chick);

// ---------- МИР ----------
const ground=new T.Mesh(new T.PlaneGeometry(300,400),M(0x7cc94f));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.02,-100);scene.add(ground);
const LANES=[-2.4,0,2.4],ROADW=8;
const road=box(ROADW,.1,400,0x4a4f58,0,-.05,-100);
box(.4,.12,400,0xe8d9a0,-ROADW/2-.3,0,-100);box(.4,.12,400,0xe8d9a0,ROADW/2+.3,0,-100);
const dashes=[];for(let l=0;l<2;l++)for(let i=0;i<40;i++)dashes.push(box(.15,.02,2.5,0xffffff,(l?1.2:-1.2),.02,-i*8));
const sunM=sph(8,0xfff3a0,40,60,-180);sunM.material=new T.MeshBasicMaterial({color:0xfff3a0,fog:false});scene.add(sunM);

const clouds=[],cloudMats=[];function mkCloud(){const g=new T.Group(),m=new T.MeshBasicMaterial({color:0xffffff,fog:false});cloudMats.push(m);[[0,0,1.3],[1.4,-.2,1],[-1.4,-.2,1],[.6,.6,.9]].forEach(([x,y,r])=>{const s=new T.Mesh(new T.SphereGeometry(r*2,12,10),m);s.position.set(x*2,y*2,0);s.scale.y=.7;g.add(s)});return g}
for(let i=0;i<10;i++){const c=mkCloud();c.position.set((Math.random()-.5)*160,28+Math.random()*14,-60-Math.random()*120);scene.add(c);clouds.push(c)}

const HC=[[0xd9602b,0xc0392b],[0x2f8fe0,0x4caf2f],[0xf29a2e,0xc2185b],[0xa03aa8,0xe85a2a],[0xf2c230,0x2a6fb8]];
function house(){const g=new T.Group(),[wc,rc]=HC[Math.random()*HC.length|0],w=5+Math.random()*2,h=4+Math.random()*4,d=5+Math.random()*2;
 box(w,h,d,wc,0,h/2,0,g);const r=new T.Mesh(new T.ConeGeometry(Math.max(w,d)*.78,2.6,4),M(rc));r.rotation.y=Math.PI/4;r.position.y=h+1.3;g.add(r);
 box(1.1,1.0,.05,0xaee3ff,0,0,0,g).position.set(-1.2,h*.35,d/2+.03);box(1.1,1.0,.05,0xffe27a,0,0,0,g).position.set(1.2,h*.35,d/2+.03);
 if(h>5.5){box(1.1,1.0,.05,0xffe27a,0,0,0,g).position.set(0,h*.75,d/2+.03)}
 box(1,1.9,.06,0x6b3a1e,0,.95,d/2+.03,g);box(.9,.9,.9,0xffffff,0,0,0,g).visible=false;box(1.3,.2,.3,0x555555,0,2.1,d/2+.15,g);return g}
function tree(){const g=new T.Group();g.add(cyl(.25,.3,1.4,0x7a4a24,0,.7,0,6));[[1.7,1.8,2.4],[1.3,3.3,1.9],[.9,4.5,1.4]].forEach(([r,y,h])=>{const c=new T.Mesh(new T.ConeGeometry(r,h*1.2,8),M(0x2f9e4f));c.position.y=y;g.add(c)});return g}
const deco=[];
const GR=[0x2f9e4f,0x3fb35e,0x278a44],FL=[0xff4081,0xffeb3b,0xffffff,0xff7043,0xab47bc];
function lamp(){const g=new T.Group();box(.12,4.2,.12,0x444a55,0,2.1,0,g);box(1.1,.1,.12,0x444a55,-.5,4.2,0,g);const l=sph(.18,0xfff3b0,-1,4.1,0);l.material=new T.MeshBasicMaterial({color:0xfff3b0});g.add(l);box(.4,.1,.4,0x333333,0,.05,0,g);return g}
function bench(){const g=new T.Group();box(1.6,.1,.5,0x8d5a2b,0,.5,0,g);box(1.6,.5,.08,0x8d5a2b,0,.85,-.22,g);box(.08,.5,.45,0x333333,-.7,.25,0,g);box(.08,.5,.45,0x333333,.7,.25,0,g);return g}
function bush(){const g=new T.Group();for(let i=0;i<4;i++)g.add(sph(.45+Math.random()*.2,GR[i%3],(i-1.5)*.5,.4,Math.random()*.3,1,.85,1));if(Math.random()<.6)for(let i=0;i<5;i++)g.add(sph(.07,FL[i%5],(Math.random()-.5)*1.6,.6+Math.random()*.3,.4));return g}
function mailbox(){const g=new T.Group();box(.1,1,.1,0x6b4a2b,0,.5,0,g);box(.5,.35,.3,0x1e88e5,0,1.1,0,g);box(.5,.05,.3,0xe53935,0,1.3,0,g);return g}
function hydrant(){const g=new T.Group();g.add(cyl(.18,.2,.7,0xe53935,0,.35,0));g.add(sph(.2,0xe53935,0,.75,0));g.add(cyl(.07,.07,.5,0xb71c1c,0,.5,0).rotateZ(Math.PI/2));return g}
function sign(){const g=new T.Group();box(.08,2.4,.08,0x888888,0,1.2,0,g);const d=cyl(.5,.5,.06,[0xe53935,0x1e88e5,0xfdd835][Math.random()*3|0],0,2.6,0.05,20);d.rotation.x=Math.PI/2;g.add(d);box(.5,.12,.08,0xffffff,0,2.6,.1,g);return g}
function fence(){const g=new T.Group();for(let i=0;i<6;i++)box(.12,.8,.06,0xf5f0e0,i*.5-1.2,.4,0,g);box(3,.08,.05,0xf5f0e0,0,.6,0,g);box(3,.08,.05,0xf5f0e0,0,.25,0,g);return g}
function hay(){const g=new T.Group();const h=cyl(.6,.6,.9,0xe6c34a,0,.6,0,16);h.rotation.z=Math.PI/2;g.add(h);const h2=cyl(.6,.6,.9,0xd9b53c,0,.6,1,16);h2.rotation.z=Math.PI/2;g.add(h2);return g}
function parked(){const g=car();g.scale.set(.9,.9,.9);return g}
function cyclist(){const g=new T.Group(),tm=new T.MeshLambertMaterial({color:0x222222});[-.55,.55].forEach(z=>{const w=new T.Mesh(new T.TorusGeometry(.35,.04,6,16),tm);w.rotation.y=Math.PI/2;w.position.set(0,.4,z);g.add(w)});
 box(.06,.06,1.1,0xe53935,0,.7,0,g);box(.4,.5,.3,[0x1e88e5,0x43a047,0xfb8c00][Math.random()*3|0],0,1.15,-.05,g);g.add(sph(.2,0xffcc99,0,1.65,-.05),sph(.22,0xe53935,0,1.75,-.05,1,.6,1));g.userData.v=-5;return g}
const BIG=[house,house,tree,tree,tree],SMALL=[lamp,lamp,bench,bush,bush,mailbox,hydrant,sign,fence,hay,parked,cyclist,bush];
function spawnDeco(z){for(const s of[-1,1]){const h=Math.random()<.5,big=BIG[Math.random()*5|0],g=big();const isH=big===house;
 g.position.set(s*(ROADW/2+(isH?6.5:5)+Math.random()*2.5),0,z);g.rotation.y=isH?(s>0?-Math.PI/2:Math.PI/2):Math.random()*6;scene.add(g);deco.push(g);
 const f=SMALL[Math.random()*SMALL.length|0],p=f();p.position.set(s*(f===parked||f===cyclist?5.3:5.2+Math.random()*.8),0,z+(Math.random()-.5)*8);
 p.rotation.y=f===cyclist?(Math.random()<.5?0:Math.PI):f===parked?(s>0?0:Math.PI):(s>0?-Math.PI/2:Math.PI/2);scene.add(p);deco.push(p)}}
// птицы
const birds=[];for(let i=0;i<7;i++){const g=new T.Group(),m=M(0x333333);const a=box(.5,.04,.2,0x333333,-.25,0,0,g),b=box(.5,.04,.2,0x333333,.25,0,0,g);g.userData={a,b,o:Math.random()*6};g.position.set((Math.random()-.5)*60,10+Math.random()*10,-30-Math.random()*120);scene.add(g);birds.push(g)}
for(let z=10;z>-190;z-=10)spawnDeco(z);

// ---------- ОБЪЕКТЫ ----------
const items=[];
function car(){const g=new T.Group(),c=[0xe53935,0x1e88e5,0xfdd835,0x8e24aa][Math.random()*4|0];
 box(2,.7,3.8,c,0,.7,0,g);box(1.7,.6,2,0xaee3ff,0,1.3,-.2,g);box(1.6,.1,1.9,c,0,1.65,-.2,g);
 [[-1,1.2],[1,1.2],[-1,-1.2],[1,-1.2]].forEach(([x,z])=>{const w=cyl(.4,.4,.3,0x222222,x,.4,z);w.rotation.z=Math.PI/2;g.add(w)});
 box(.4,.2,.05,0xffff99,-.6,.8,1.92,g);box(.4,.2,.05,0xffff99,.6,.8,1.92,g);return g}

const bs=$('bsong'),ss=$('ssong');let bonusT=0;

function loop(now){requestAnimationFrame(loop);const rdt=Math.min((now-last)/1000,.05);ts+=((sleepT>0?.38:1)-ts)*Math.min(1,rdt*3);const dt=rdt*ts;last=now;nightK+=((sleepT>0?1:0)-nightK)*Math.min(1,rdt*1.4);if(Math.abs(nightK-lastNK)>.003){lastNK=nightK;applyNight(nightK)}
 birds.forEach(b=>{const w=Math.sin(now/110+b.userData.o)*.6;b.userData.a.rotation.z=w;b.userData.b.rotation.z=-w});
 clouds.forEach(c=>{c.position.x+=dt*1.5;if(c.position.x>90)c.position.x=-90});
 if(st=='intro'){introT+=dt;if(introT>1.7){st='run';$('hud').classList.remove('hidden')}}
 if(st=='run'){
  speed=Math.min(34,14+dist/60);dist+=speed*dt;score+=speed*dt*.5;runT+=dt*speed*.55;
  px+=(LANES[lane]-px)*Math.min(1,dt*14);
  vy-=32*dt;py+=vy*dt;if(py<0){py=0;vy=0}

  nextSpawn+=mv;while(nextSpawn>-150)spawn();
  for(let i=items.length-1;i>=0;i--){const o=items[i];o.z+=mv+(o.v||0)*dt;o.g.position.z=o.z;
   if(o.type=='coin'||o.type=='badge'||o.type=='bottle'){o.g.rotation.y+=dt*5;if(o.type!='coin'){const p=1.3+Math.sin(now/150)*.1;o.g.scale.set(p,p,p)}if(Math.abs(o.z)<.9&&Math.abs(LANES[o.lane]-px)<1&&Math.abs(o.y-(py+.7))<1.2){if(o.type=='badge')startBonus();else if(o.type=='bottle')startSleep();else{const m=bonusT>0?2:1;coins+=m;score+=10*m;chirp(1,.05)}scene.remove(o.g);items.splice(i,1);continue}}
   else if(Math.abs(o.z)<o.hl+.35&&Math.abs(LANES[o.lane]-px)<.95){
    const hit=o.type=='car'?py<1.7:o.type=='truck'?py<2.8:(o.type=='low'||o.type=='cone')?py<.85:!(sliding&&py<.05);
    if(hit){die()}}
   if(o.z>10){scene.remove(o.g);items.splice(i,1)}}
  chirpT-=dt;if(chirpT<=0){chirpT=6+Math.random()*6;if(sleepT<=0)chirp(2,.1)}
  if(sleepT>0){if(!ss.paused&&isFinite(ss.duration))sleepT=Math.max(.05,ss.duration-ss.currentTime);else sleepT-=rdt;$('slt').textContent=Math.max(0,Math.ceil(sleepT));if(sleepT<=0)stopSleep()}
  if(bonusT>0){if(!bs.paused&&isFinite(bs.duration))bonusT=Math.max(.05,bs.duration-bs.currentTime);else bonusT-=dt;$('bt').textContent=Math.max(0,Math.ceil(bonusT));if(bonusT<=0)stopBonus()}
  $('dist').textContent=Math.floor(dist);$('coins').textContent=coins;$('score').textContent=Math.floor(score);
 }
 if(st=='dead'){deadT+=dt;body.rotation.x=Math.min(deadT*5,1.5);body.position.y=Math.max(0,.2-deadT*.3);wingL.rotation.z=wingR.rotation.z=-1.3;legs.forEach(l=>{l.rotation.x=.5;l.knee.rotation.x=0})}
 else{const sw=Math.sin(runT*1.7),cs=Math.cos(runT*1.7),air=py>.05,run=st=='run';
  const tgt=run||(st=='intro'&&introT>1.05)?Math.PI:0;turnY+=(tgt-turnY)*Math.min(1,dt*7);
  if(prevAir&&!air){landT=.22}prevAir=air;landT=Math.max(0,landT-dt);
  const lean=(LANES[lane]-px);

  let sy=1,sxz=1,by=0,tilt=0;

   else if(air){sy=vy>0?1.1:1.02;sxz=1/Math.sqrt(sy);tilt=vy>0?.08:-.1}
   else{by=Math.abs(sw)*.1;tilt=.1+(speed-14)*.004;sy=1+cs*.025;sxz=1-cs*.015}

  body.position.y=by;body.rotation.x=tilt;body.scale.set(sxz,sy,sxz);body.rotation.z=run?Math.sin(runT*1.7)*.05:0;
  face.visible=!run||turnY<2.9;
  if(run&&!(sliding&&!air)){const a=air?0:sw;
   legs[0].rotation.x=air?.9:a*1.0;legs[1].rotation.x=air?-.5:-a*1.0;
   legs[0].knee.rotation.x=air?-1.2:Math.max(0,-cs>0?0:0)+Math.max(0,Math.cos(runT*1.7+1.2))*-1.0;legs[1].knee.rotation.x=air?-.6:Math.max(0,-Math.cos(runT*1.7+1.2))*-1.0;
