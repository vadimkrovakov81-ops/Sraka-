<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Цып-Цып — Runner</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:Arial,sans-serif;touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
.hud{display:flex;justify-content:space-between;gap:8px;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));font-weight:900;text-shadow:0 2px 4px #0007}
.pill{background:#0a2a4acc;border:2px solid #fff5;border-radius:16px;padding:8px 14px}
.center{position:absolute;inset:0;display:grid;place-items:center;padding:20px;pointer-events:auto;background:#0a2a4a55}
.panel{width:min(400px,94vw);padding:26px 22px;border-radius:28px;background:linear-gradient(160deg,#2a6fb8,#123a68);border:2px solid #fff5;box-shadow:0 20px 70px #0008;text-align:center}
.logo{font-size:40px;font-weight:900;margin:0 0 6px}.sub{opacity:.85;margin-bottom:20px}
button{width:100%;border:0;border-radius:18px;padding:16px;font-size:22px;font-weight:900;color:#2a1a00;background:linear-gradient(#ffe978,#ffb72d);box-shadow:0 7px 0 #9c641b;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 3px 0 #9c641b}
.tips{display:flex;gap:8px;margin-top:16px;font-size:12px}.tips div{flex:1;background:#ffffff18;border-radius:12px;padding:9px 4px}.tips b{display:block;font-size:20px}
.hidden{display:none!important}
</style></head><body><canvas id="c"></canvas>
<div id="ui"><div id="hud" class="hud hidden"><div class="pill">🏃 <span id="dist">0</span> м</div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">⭐ <span id="score">0</span></div></div>
<div id="menu" class="center"><div class="panel"><div class="logo">🐥 ЦЫП-ЦЫП</div><div class="sub">Беги, прыгай, собирай монеты!</div><button id="start">▶ ИГРАТЬ</button>
<div class="tips"><div><b>← →</b>Полосы</div><div><b>↑</b>Прыжок</div><div><b>↓</b>Подкат</div></div><div class="sub" style="margin:14px 0 0;font-size:12px">Свайпы на телефоне • стрелки / WASD на компьютере</div></div></div>
<div id="over" class="center hidden"><div class="panel"><div class="logo">💥 ОЙ!</div><div class="sub">Счёт: <b id="fs">0</b> • монет: <b id="fc">0</b> • рекорд: <b id="best">0</b></div><button id="again">↻ ЕЩЁ РАЗ</button></div></div></div>
<audio id="music" src="cypa_song.mp3" loop preload="auto"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),T=THREE;
const renderer=new T.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene();scene.background=new T.Color(0x8fd3ff);scene.fog=new T.Fog(0xbfe6ff,50,150);
const cam=new T.PerspectiveCamera(60,1,.1,300);
scene.add(new T.HemisphereLight(0xffffff,0x6aa84f,.9));
const sun=new T.DirectionalLight(0xfff2c0,.9);sun.position.set(-8,15,6);scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();

const mats={};const M=(c,o={})=>mats[c+JSON.stringify(o)]||(mats[c+JSON.stringify(o)]=new T.MeshLambertMaterial(Object.assign({color:c},o)));
function box(w,h,d,c,x=0,y=0,z=0,p){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(p||scene).add(m);return m}
function cyl(rt,rb,h,c,x,y,z,seg=12){const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg),M(c));m.position.set(x,y,z);return m}
function sph(r,c,x,y,z,sx=1,sy=1,sz=1){const m=new T.Mesh(new T.SphereGeometry(r,20,16),M(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m}

// ---------- ЦЫПА ----------
const chick=new T.Group(),body=new T.Group();chick.add(body);
body.add(sph(.62,0xffa726,0,.95,0,1,1,.95));                       // пушистое тело
for(let i=0;i<14;i++){const a=i/14*6.28;body.add(sph(.2,0xffb53d,Math.cos(a)*.52,.95+Math.sin(a*2)*.25,Math.sin(a)*.4,1,1,1))}
const shell=new T.Mesh(new T.SphereGeometry(.64,20,12,0,6.283,1.7,1.45),new T.MeshLambertMaterial({color:0xe2b98e,side:T.DoubleSide}));shell.position.y=.78;body.add(shell);
for(let i=0;i<9;i++){const a=i/9*6.28;const t=new T.Mesh(new T.ConeGeometry(.09,.2,4),M(0xf3d9b8));t.position.set(Math.cos(a)*.6,1.02,Math.sin(a)*.6);body.add(t)} // зубчики скорлупы
[-.25,.25].forEach(x=>{body.add(sph(.2,0xffffff,x,1.2,.52,1,1.1,.6),sph(.12,0x3b9de8,x,1.2,.66,1,1,.5),sph(.06,0x111111,x,1.2,.72,1,1,.5))});
const beak=new T.Mesh(new T.ConeGeometry(.08,.16,6),M(0xf06a1a));beak.rotation.x=Math.PI/2;beak.position.set(0,1.03,.62);body.add(beak);
for(let i=0;i<3;i++){const t=new T.Mesh(new T.ConeGeometry(.04,.45,5),M(0xffa726));t.position.set((i-1)*.1,1.7,0);t.rotation.z=(i-1)*-.35;body.add(t)}
const wingL=new T.Group(),wingR=new T.Group();[wingL,wingR].forEach((w,i)=>{w.add(sph(.2,0xffa726,0,-.2,0,.5,1.4,.8));w.position.set(i?.62:-.62,1.1,0);body.add(w)});
const legs=[-.2,.2].map(x=>{const g=new T.Group();g.position.set(x,.5,0);g.add(cyl(.03,.03,.5,0xf08a1a,0,-.25,0,6));const f=box(.28,.05,.34,0xf08a1a,0,-.5,.1,g);chick.add(g);return g});
scene.add(chick);

// ---------- МИР ----------
const ground=new T.Mesh(new T.PlaneGeometry(300,400),M(0x7cc94f));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.02,-100);scene.add(ground);
const LANES=[-2.4,0,2.4],ROADW=8;
const road=box(ROADW,.1,400,0x4a4f58,0,-.05,-100);
box(.4,.12,400,0xe8d9a0,-ROADW/2-.3,0,-100);box(.4,.12,400,0xe8d9a0,ROADW/2+.3,0,-100);
const dashes=[];for(let l=0;l<2;l++)for(let i=0;i<40;i++)dashes.push(box(.15,.02,2.5,0xffffff,(l?1.2:-1.2),.02,-i*8));
const sunM=sph(8,0xfff3a0,40,60,-180);sunM.material=new T.MeshBasicMaterial({color:0xfff3a0,fog:false});scene.add(sunM);

const clouds=[];function mkCloud(){const g=new T.Group(),m=new T.MeshBasicMaterial({color:0xffffff,fog:false});[[0,0,1.3],[1.4,-.2,1],[-1.4,-.2,1],[.6,.6,.9]].forEach(([x,y,r])=>{const s=new T.Mesh(new T.SphereGeometry(r*2,12,10),m);s.position.set(x*2,y*2,0);s.scale.y=.7;g.add(s)});return g}
for(let i=0;i<10;i++){const c=mkCloud();c.position.set((Math.random()-.5)*160,28+Math.random()*14,-60-Math.random()*120);scene.add(c);clouds.push(c)}

const HC=[[0xd9602b,0xc0392b],[0x2f8fe0,0x4caf2f],[0xf29a2e,0xc2185b],[0xa03aa8,0xe85a2a],[0xf2c230,0x2a6fb8]];
function house(){const g=new T.Group(),[wc,rc]=HC[Math.random()*HC.length|0],w=5+Math.random()*2,h=4+Math.random()*4,d=5+Math.random()*2;
 box(w,h,d,wc,0,h/2,0,g);const r=new T.Mesh(new T.ConeGeometry(Math.max(w,d)*.78,2.6,4),M(rc));r.rotation.y=Math.PI/4;r.position.y=h+1.3;g.add(r);
 box(1.1,1.0,.05,0xaee3ff,0,0,0,g).position.set(-1.2,h*.35,d/2+.03);box(1.1,1.0,.05,0xffe27a,0,0,0,g).position.set(1.2,h*.35,d/2+.03);
 if(h>5.5){box(1.1,1.0,.05,0xffe27a,0,0,0,g).position.set(0,h*.75,d/2+.03)}
 box(1,1.9,.06,0x6b3a1e,0,.95,d/2+.03,g);box(.9,.9,.9,0xffffff,0,0,0,g).visible=false;box(1.3,.2,.3,0x555555,0,2.1,d/2+.15,g);return g}
function tree(){const g=new T.Group();g.add(cyl(.25,.3,1.4,0x7a4a24,0,.7,0,6));[[1.7,1.8,2.4],[1.3,3.3,1.9],[.9,4.5,1.4]].forEach(([r,y,h])=>{const c=new T.Mesh(new T.ConeGeometry(r,h*1.2,8),M(0x2f9e4f));c.position.y=y;g.add(c)});return g}
const deco=[];function spawnDeco(z){for(const s of[-1,1]){const h=Math.random()<.65,g=h?house():tree();g.position.set(s*(ROADW/2+(h?6:4.5)+Math.random()*2),0,z);g.rotation.y=h?(s>0?-Math.PI/2:Math.PI/2):Math.random()*6;scene.add(g);deco.push(g)}}
for(let z=10;z>-190;z-=10)spawnDeco(z);

// ---------- ОБЪЕКТЫ ----------
const items=[];
function car(){const g=new T.Group(),c=[0xe53935,0x1e88e5,0xfdd835,0x8e24aa][Math.random()*4|0];
 box(2,.7,3.8,c,0,.7,0,g);box(1.7,.6,2,0xaee3ff,0,1.3,-.2,g);box(1.6,.1,1.9,c,0,1.65,-.2,g);
 [[-1,1.2],[1,1.2],[-1,-1.2],[1,-1.2]].forEach(([x,z])=>{const w=cyl(.4,.4,.3,0x222222,x,.4,z);w.rotation.z=Math.PI/2;g.add(w)});
 box(.4,.2,.05,0xffff99,-.6,.8,1.92,g);box(.4,.2,.05,0xffff99,.6,.8,1.92,g);return g}
function barrier(){const g=new T.Group();box(2.2,.5,.4,0xff7043,0,.65,0,g);box(2.2,.2,.42,0xffffff,0,.65,0,g);box(.15,.5,.15,0x666666,-.9,.25,0,g);box(.15,.5,.15,0x666666,.9,.25,0,g);return g}
function bar(){const g=new T.Group();box(.25,3,.25,0x666666,-1.05,1.5,0,g);box(.25,3,.25,0x666666,1.05,1.5,0,g);box(2.3,.7,.3,0xffd600,0,1.9,0,g);box(.5,.7,.32,0x222222,-.6,1.9,0,g);box(.5,.7,.32,0x222222,.5,1.9,0,g);return g}
const coinG=new T.CylinderGeometry(.38,.38,.1,16),coinM=new T.MeshLambertMaterial({color:0xffc400,emissive:0x664400});
function addObs(type,lane,z){const g=type=='car'?car():type=='low'?barrier():bar();g.position.set(LANES[lane],0,z);scene.add(g);items.push({g,type,lane,z,hl:type=='car'?2:.5});}
function addCoin(lane,z,y=.9){const m=new T.Mesh(coinG,coinM);m.rotation.z=Math.PI/2;m.position.set(LANES[lane],y,z);scene.add(m);items.push({g:m,type:'coin',lane,z,y});}

// ---------- ИГРА ----------
let st='menu',speed,dist,coins,score,lane,px,py,vy,sliding,slideT,nextSpawn,runT,best=0,deadT;
try{best=+localStorage.cyp||0}catch(e){}
function reset(){items.forEach(i=>scene.remove(i.g));items.length=0;speed=14;dist=0;coins=0;score=0;lane=1;px=0;py=0;vy=0;sliding=false;slideT=0;nextSpawn=-30;runT=0;deadT=0;chick.rotation.set(0,0,0);body.scale.set(1,1,1)}
function spawn(){const z=nextSpawn,r=Math.random();
 if(r<.3){const l=Math.random()*3|0;addObs('car',l,z);if(Math.random()<.5)addObs('car',(l+1+(Math.random()*2|0))%3,z);const f=[0,1,2].filter(i=>!items.some(o=>o.z==z&&o.lane==i&&o.type=='car'));for(let k=0;k<5;k++)addCoin(f[0],z-k*2)}
 else if(r<.55){const l=Math.random()*3|0;addObs('low',l,z);for(let k=-2;k<=2;k++)addCoin(l,z+k*1.6,1.1+(2-Math.abs(k))*.35)}
 else if(r<.75){const l=Math.random()*3|0;addObs('high',l,z);for(let k=0;k<4;k++)addCoin(l,z+k*1.5,.6)}
 else{const l=Math.random()*3|0;for(let k=0;k<8;k++)addCoin(l,z-k*2)}
 nextSpawn-=14+Math.random()*10+speed*.3}
function die(){st='dead';deadT=0;const sc=Math.floor(score);if(sc>best){best=sc;try{localStorage.cyp=best}catch(e){}}
 $('fs').textContent=sc;$('fc').textContent=coins;$('best').textContent=best;setTimeout(()=>{$('over').classList.remove('hidden');$('hud').classList.add('hidden')},700)}
function left(){if(st=='run'&&lane>0)lane--}function right(){if(st=='run'&&lane<2)lane++}
function jump(){if(st=='run'&&py<.05){vy=11;sliding=false}}function slide(){if(st!='run')return;if(py>.05)vy=-16;sliding=true;slideT=.7}
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')left();if(k=='ArrowRight'||k=='d')right();if(k=='ArrowUp'||k=='w'||k==' ')jump();if(k=='ArrowDown'||k=='s')slide()});
let tx,ty;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<24)jump();else if(Math.abs(dx)>Math.abs(dy))dx<0?left():right();else dy<0?jump():slide();tx=null},{passive:true});
function begin(){reset();st='run';$('menu').classList.add('hidden');$('over').classList.add('hidden');$('hud').classList.remove('hidden');const m=$('music');m.currentTime=0;m.play().catch(()=>{})}
$('start').onclick=begin;$('again').onclick=begin;
reset();

let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 clouds.forEach(c=>{c.position.x+=dt*1.5;if(c.position.x>90)c.position.x=-90});
 if(st=='run'){
  speed=Math.min(34,14+dist/60);dist+=speed*dt;score+=speed*dt*.5;runT+=dt*speed*.55;
  px+=(LANES[lane]-px)*Math.min(1,dt*14);
  vy-=32*dt;py+=vy*dt;if(py<0){py=0;vy=0}
  if(sliding){slideT-=dt;if(slideT<=0)sliding=false}
  const ph=sliding&&py<.05?.6:1.4;
  // движение мира
  const mv=speed*dt;
  dashes.forEach(d=>{d.position.z+=mv;if(d.position.z>10)d.position.z-=320});
  deco.forEach(d=>{d.position.z+=mv;if(d.position.z>14){d.position.z-=200+Math.random()*10}});
  nextSpawn+=mv;while(nextSpawn>-150)spawn();
  for(let i=items.length-1;i>=0;i--){const o=items[i];o.z+=mv;o.g.position.z=o.z;
   if(o.type=='coin'){o.g.rotation.y+=dt*5;if(Math.abs(o.z)<.9&&Math.abs(LANES[o.lane]-px)<1&&Math.abs(o.y-(py+.7))<1.2){coins++;score+=10;scene.remove(o.g);items.splice(i,1);continue}}
   else if(Math.abs(o.z)<o.hl+.35&&Math.abs(LANES[o.lane]-px)<.95){
    const hit=o.type=='car'?py<1.7:o.type=='low'?py<.85:!(sliding&&py<.05);
    if(hit){die()}}
   if(o.z>10){scene.remove(o.g);items.splice(i,1)}}
  $('dist').textContent=Math.floor(dist);$('coins').textContent=coins;$('score').textContent=Math.floor(score);
 }
 if(st=='dead'){deadT+=dt;chick.rotation.x=Math.min(deadT*4,1.4);chick.position.y=Math.max(0,.3-deadT)}
 else{ // анимация цыпы
  const s=Math.sin(runT*1.6),air=py>.05;
  chick.position.set(px,py,0);chick.rotation.z=(LANES[lane]-px)*-.12;
  body.position.y=air||sliding?0:Math.abs(s)*.12;
  body.scale.set(1,sliding&&!air?.55:air?1.12:1,1);
  legs[0].rotation.x=air?.6:s*.9;legs[1].rotation.x=air?-.3:-s*.9;
  const f=air?.9:s*.5;wingL.rotation.z=.2+f;wingR.rotation.z=-.2-f;
  if(st=='menu'){wingR.rotation.z=-1.2+Math.sin(now/180)*.3;chick.rotation.y=Math.sin(now/700)*.5}else chick.rotation.y=0}
 cam.position.set(px*.55,4.2+py*.25,6.5);cam.lookAt(px*.3,1.3,-8);
 renderer.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
