<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),T=THREE;
const renderer=new T.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene();scene.background=new T.Color(0x8fd3ff);scene.fog=new T.Fog(0xbfe6ff,50,150);
const cam=new T.PerspectiveCamera(60,1,.1,300);
scene.add(new T.HemisphereLight(0xffffff,0x6aa84f,.9));
const sun=new T.DirectionalLight(0xfff2c0,.9);sun.position.set(-8,15,6);scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();

const mats={};const M=(c,o={})=>mats[c+JSON.stringify(o)]||(mats[c+JSON.stringify(o)]=new T.MeshLambertMaterial(Object.assign({color:c},o)));
function box(w,h,d,c,x=0,y=0,z=0,p){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(p||scene).add(m);return m}
function cyl(rt,rb,h,c,x,y,z,seg=12){const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg),M(c));m.position.set(x,y,z);return m}
function sph(r,c,x,y,z,sx=1,sy=1,sz=1){const m=new T.Mesh(new T.SphereGeometry(r,20,16),M(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m}

// ---------- МАЛЫШКА ----------
function fabric(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#a9a5a3';x.fillRect(0,0,256,256);
 const cols=['#b23a58','#5b8fd6','#f2d23c','#58a65a','#e86a8a','#3c4f9c'];
 for(let i=0;i<120;i++){const px=Math.random()*256,py=Math.random()*256;x.fillStyle=cols[i%6];for(let k=0;k<5;k++){const a=k/5*6.28;x.beginPath();x.arc(px+Math.cos(a)*5,py+Math.sin(a)*5,3.7,0,6.3);x.fill()}x.fillStyle='#f6ecd0';x.beginPath();x.arc(px,py,2,0,6.3);x.fill()}
 const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(3,1);return t}
const SK=0xf7d1b4,HR=0x9c7a52,fab=new T.MeshLambertMaterial({map:fabric(),side:T.DoubleSide});
const chick=new T.Group(),body=new T.Group(),model=new T.Group();chick.add(model);model.add(body);model.scale.setScalar(.8);
const fm=(g,x,y,z,sx=1,sy=1,sz=1)=>{const m=new T.Mesh(g,fab);m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m};
body.add(fm(new T.CylinderGeometry(.4,.64,.8,28),0,.98,0));                                   // платье
const col=new T.Mesh(new T.TorusGeometry(.27,.035,8,24),M(0x8f8c8a));col.rotation.x=Math.PI/2;col.position.y=1.37;body.add(col);
body.add(cyl(.15,.18,.2,SK,0,1.43,0,14));
[-1,1].forEach(s=>body.add(fm(new T.SphereGeometry(.17,14,10),s*.45,1.27,0,.9,.75,1)));       // рукавчики-крылышки
// голова
const head=sph(.52,SK,0,1.78,0,1,.95,.95);body.add(head);
[-1,1].forEach(s=>body.add(sph(.1,SK,s*.5,1.74,0,.6,1,.9)));
const hair=new T.Mesh(new T.SphereGeometry(.55,30,20,0,6.283,0,1.85),new T.MeshLambertMaterial({color:HR,side:T.DoubleSide}));hair.position.set(0,1.8,-.03);hair.rotation.x=-.9;body.add(hair);
for(let i=0;i<5;i++){const w=new T.Mesh(new T.ConeGeometry(.06,.3,5),M(i%2?0xc99a63:0xa87b48));w.position.set((i-2)*.1,2.3-Math.abs(i-2)*.03,.0+(i%2)*.05);w.rotation.z=(i-2)*-.35;w.rotation.x=.25;body.add(w)}
// лицо
const face=new T.Group();
[-1,1].forEach(s=>{face.add(sph(.1,0xffffff,s*.19,1.78,.43,1,1.05,.5),sph(.065,0x6f93b8,s*.19,1.78,.46,1,1,.5),sph(.035,0x10151c,s*.19,1.78,.48,1,1,.5),sph(.014,0xffffff,s*.19+.02,1.81,.5,1,1,.5),sph(.11,0xf59a98,s*.3,1.64,.36,1,.8,.5));
 const br=box(.14,.025,.025,0xa67c4a,s*.19,1.93,.42,face);br.rotation.z=s*.15});
face.add(sph(.05,0xf1b49a,0,1.69,.5,1,.9,.8));
const mo=new T.Mesh(new T.TorusGeometry(.09,.016,6,18,Math.PI),M(0xc2565b));mo.rotation.z=Math.PI;mo.position.set(0,1.62,.47);face.add(mo);body.add(face);
// полицейский наряд (бонус)
const outfit=new T.Group();
outfit.add(cyl(.5,.56,.3,0x16347f,0,2.27,0,24),cyl(.58,.58,.1,0x0d1a3d,0,2.14,0,24),cyl(.6,.5,.07,0x1f3d99,0,2.44,0,24));
{const br=box(.75,.05,.42,0x0d1a3d,0,2.1,.52,outfit);br.rotation.x=.15;outfit.add(sph(.09,0xffd54f,0,2.25,.53,1,1.2,.3))}
[-1,1].forEach(s=>outfit.add(sph(.15,0x0a0a0a,s*.19,1.78,.47,1,.8,.4),box(.03,.03,.5,0x0a0a0a,s*.5,1.79,.22,outfit)));
box(.12,.03,.03,0x0a0a0a,0,1.8,.5,outfit);outfit.visible=false;body.add(outfit);
// руки
function mkArm(s){const w=new T.Group(),sk=M(SK);w.position.set(s*.5,1.27,0);w.add(cyl(.07,.065,.3,SK,0,-.15,0,10));
 const el=new T.Group();el.position.y=-.3;el.add(cyl(.06,.055,.26,SK,0,-.13,0,10),sph(.08,SK,0,-.28,0));w.add(el);w.el=el;body.add(w);return w}
const wingL=mkArm(-1),wingR=mkArm(1);
// ноги: леггинсы + розовые ботиночки
const legs=[-.2,.2].map(x=>{const hip=new T.Group();hip.position.set(x,.54,0);hip.add(cyl(.085,.075,.28,0xf3ece6,0,-.14,0,10));
 const knee=new T.Group();knee.position.y=-.28;knee.add(cyl(.075,.07,.26,0xf3ece6,0,-.13,0,10));
 const foot=new T.Group();foot.position.y=-.26;box(.17,.1,.3,0xf4b3c6,0,.05,.05,foot);box(.18,.03,.32,0xffffff,0,.015,.05,foot);knee.add(foot);hip.add(knee);hip.knee=knee;hip.foot=foot;model.add(hip);return hip});
const blob=new T.Mesh(new T.CircleGeometry(.7,20),new T.MeshBasicMaterial({color:0,transparent:true,opacity:.28,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.y=.03;scene.add(blob);
scene.add(chick);

// ---------- МИР ----------
const ground=new T.Mesh(new T.PlaneGeometry(300,400),M(0x7cc94f));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.02,-100);scene.add(ground);
const LANES=[-2.4,0,2.4],ROADW=8;
const road=box(ROADW,.1,400,0x4a4f58,0,-.05,-100);
box(.4,.12,400,0xe8d9a0,-ROADW/2-.3,0,-100);box(.4,.12,400,0xe8d9a0,ROADW/2+.3,0,-100);
const dashes=[];for(let l=0;l<2;l++)for(let i=0;i<40;i++)dashes.push(box(.15,.02,2.5,0xffffff,(l?1.2:-1.2),.02,-i*8));
const sunM=sph(8,0xfff3a0,40,60,-180);sunM.material=new T.MeshBasicMaterial({color:0xfff3a0,fog:false});scene.add(sunM);

const clouds=[];function mkCloud(){const g=new T.Group(),m=new T.MeshBasicMaterial({color:0xffffff,fog:false});[[0,0,1.3],[1.4,-.2,1],[-1.4,-.2,1],[.6,.6,.9]].forEach(([x,y,r])=>{const s=new T.Mesh(new T.SphereGeometry(r*2,12,10),m);s.position.set(x*2,y*2,0);s.scale.y=.7;g.add(s)});return g}
for(let i=0;i<10;i++){const c=mkCloud();c.position.set((Math.random()-.5)*160,28+Math.random()*14,-60-Math.random()*120);scene.add(c);clouds.push(c)}

const HC=[[0xd9602b,0xc0392b],[0x2f8fe0,0x4caf2f],[0xf29a2e,0xc2185b],[0xa03aa8,0xe85a2a],[0xf2c230,0x2a6fb8]];
function house(){const g=new T.Group(),[wc,rc]=HC[Math.random()*HC.length|0],w=5+Math.random()*2,h=4+Math.random()*4,d=5+Math.random()*2;
 box(w,h,d,wc,0,h/2,0,g);const r=new T.Mesh(new T.ConeGeometry(Math.max(w,d)*.78,2.6,4),M(rc));r.rotation.y=Math.PI/4;r.position.y=h+1.3;g.add(r);
 box(1.1,1.0,.05,0xaee3ff,0,0,0,g).position.set(-1.2,h*.35,d/2+.03);box(1.1,1.0,.05,0xffe27a,0,0,0,g).position.set(1.2,h*.35,d/2+.03);
 if(h>5.5){box(1.1,1.0,.05,0xffe27a,0,0,0,g).position.set(0,h*.75,d/2+.03)}
 box(1,1.9,.06,0x6b3a1e,0,.95,d/2+.03,g);box(.9,.9,.9,0xffffff,0,0,0,g).visible=false;box(1.3,.2,.3,0x555555,0,2.1,d/2+.15,g);return g}
function tree(){const g=new T.Group();g.add(cyl(.25,.3,1.4,0x7a4a24,0,.7,0,6));[[1.7,1.8,2.4],[1.3,3.3,1.9],[.9,4.5,1.4]].forEach(([r,y,h])=>{const c=new T.Mesh(new T.ConeGeometry(r,h*1.2,8),M(0x2f9e4f));c.position.y=y;g.add(c)});return g}
const deco=[];
const GR=[0x2f9e4f,0x3fb35e,0x278a44],FL=[0xff4081,0xffeb3b,0xffffff,0xff7043,0xab47bc];
function lamp(){const g=new T.Group();box(.12,4.2,.12,0x444a55,0,2.1,0,g);box(1.1,.1,.12,0x444a55,-.5,4.2,0,g);const l=sph(.18,0xfff3b0,-1,4.1,0);l.material=new T.MeshBasicMaterial({color:0xfff3b0});g.add(l);box(.4,.1,.4,0x333333,0,.05,0,g);return g}
function bench(){const g=new T.Group();box(1.6,.1,.5,0x8d5a2b,0,.5,0,g);box(1.6,.5,.08,0x8d5a2b,0,.85,-.22,g);box(.08,.5,.45,0x333333,-.7,.25,0,g);box(.08,.5,.45,0x333333,.7,.25,0,g);return g}
function bush(){const g=new T.Group();for(let i=0;i<4;i++)g.add(sph(.45+Math.random()*.2,GR[i%3],(i-1.5)*.5,.4,Math.random()*.3,1,.85,1));if(Math.random()<.6)for(let i=0;i<5;i++)g.add(sph(.07,FL[i%5],(Math.random()-.5)*1.6,.6+Math.random()*.3,.4));return g}
function mailbox(){const g=new T.Group();box(.1,1,.1,0x6b4a2b,0,.5,0,g);box(.5,.35,.3,0x1e88e5,0,1.1,0,g);box(.5,.05,.3,0xe53935,0,1.3,0,g);return g}
function hydrant(){const g=new T.Group();g.add(cyl(.18,.2,.7,0xe53935,0,.35,0));g.add(sph(.2,0xe53935,0,.75,0));g.add(cyl(.07,.07,.5,0xb71c1c,0,.5,0).rotateZ(Math.PI/2));return g}
function sign(){const g=new T.Group();box(.08,2.4,.08,0x888888,0,1.2,0,g);const d=cyl(.5,.5,.06,[0xe53935,0x1e88e5,0xfdd835][Math.random()*3|0],0,2.6,0.05,20);d.rotation.x=Math.PI/2;g.add(d);box(.5,.12,.08,0xffffff,0,2.6,.1,g);return g}
function fence(){const g=new T.Group();for(let i=0;i<6;i++)box(.12,.8,.06,0xf5f0e0,i*.5-1.2,.4,0,g);box(3,.08,.05,0xf5f0e0,0,.6,0,g);box(3,.08,.05,0xf5f0e0,0,.25,0,g);return g}
function hay(){const g=new T.Group();const h=cyl(.6,.6,.9,0xe6c34a,0,.6,0,16);h.rotation.z=Math.PI/2;g.add(h);const h2=cyl(.6,.6,.9,0xd9b53c,0,.6,1,16);h2.rotation.z=Math.PI/2;g.add(h2);return g}
function parked(){const g=car();g.scale.set(.9,.9,.9);return g}
function cyclist(){const g=new T.Group(),tm=new T.MeshLambertMaterial({color:0x222222});[-.55,.55].forEach(z=>{const w=new T.Mesh(new T.TorusGeometry(.35,.04,6,16),tm);w.rotation.y=Math.PI/2;w.position.set(0,.4,z);g.add(w)});
 box(.06,.06,1.1,0xe53935,0,.7,0,g);box(.4,.5,.3,[0x1e88e5,0x43a047,0xfb8c00][Math.random()*3|0],0,1.15,-.05,g);g.add(sph(.2,0xffcc99,0,1.65,-.05),sph(.22,0xe53935,0,1.75,-.05,1,.6,1));g.userData.v=-5;return g}
const BIG=[house,house,tree,tree,tree],SMALL=[lamp,lamp,bench,bush,bush,mailbox,hydrant,sign,fence,hay,parked,cyclist,bush];
function spawnDeco(z){for(const s of[-1,1]){const h=Math.random()<.5,big=BIG[Math.random()*5|0],g=big();const isH=big===house;
 g.position.set(s*(ROADW/2+(isH?6.5:5)+Math.random()*2.5),0,z);g.rotation.y=isH?(s>0?-Math.PI/2:Math.PI/2):Math.random()*6;scene.add(g);deco.push(g);
 const f=SMALL[Math.random()*SMALL.length|0],p=f();p.position.set(s*(f===parked||f===cyclist?5.3:5.2+Math.random()*.8),0,z+(Math.random()-.5)*8);
 p.rotation.y=f===cyclist?(Math.random()<.5?0:Math.PI):f===parked?(s>0?0:Math.PI):(s>0?-Math.PI/2:Math.PI/2);scene.add(p);deco.push(p)}}
// птицы
const birds=[];for(let i=0;i<7;i++){const g=new T.Group(),m=M(0x333333);const a=box(.5,.04,.2,0x333333,-.25,0,0,g),b=box(.5,.04,.2,0x333333,.25,0,0,g);g.userData={a,b,o:Math.random()*6};g.position.set((Math.random()-.5)*60,10+Math.random()*10,-30-Math.random()*120);scene.add(g);birds.push(g)}
for(let z=10;z>-190;z-=10)spawnDeco(z);

// ---------- ОБЪЕКТЫ ----------
const items=[];
function car(){const g=new T.Group(),c=[0xe53935,0x1e88e5,0xfdd835,0x8e24aa][Math.random()*4|0];
 box(2,.7,3.8,c,0,.7,0,g);box(1.7,.6,2,0xaee3ff,0,1.3,-.2,g);box(1.6,.1,1.9,c,0,1.65,-.2,g);
 [[-1,1.2],[1,1.2],[-1,-1.2],[1,-1.2]].forEach(([x,z])=>{const w=cyl(.4,.4,.3,0x222222,x,.4,z);w.rotation.z=Math.PI/2;g.add(w)});
 box(.4,.2,.05,0xffff99,-.6,.8,1.92,g);box(.4,.2,.05,0xffff99,.6,.8,1.92,g);return g}
function barrier(){const g=new T.Group();box(2.2,.5,.4,0xff7043,0,.65,0,g);box(2.2,.2,.42,0xffffff,0,.65,0,g);box(.15,.5,.15,0x666666,-.9,.25,0,g);box(.15,.5,.15,0x666666,.9,.25,0,g);return g}
function bar(){const g=new T.Group();box(.25,3,.25,0x666666,-1.05,1.5,0,g);box(.25,3,.25,0x666666,1.05,1.5,0,g);box(2.3,.7,.3,0xffd600,0,1.9,0,g);box(.5,.7,.32,0x222222,-.6,1.9,0,g);box(.5,.7,.32,0x222222,.5,1.9,0,g);return g}
function badge(){const g=new T.Group(),d=new T.Group();d.add(cyl(.5,.5,.12,0x1f4fc4,0,0,0,24),cyl(.56,.56,.08,0xffd54f,0,0,0,24),cyl(.4,.4,.14,0x16347f,0,0,0,24),cyl(.3,.3,.18,0xffd54f,0,0,0,5));d.rotation.z=Math.PI/2;g.add(d);
 const gl=new T.Mesh(new T.SphereGeometry(.85,12,10),new T.MeshBasicMaterial({color:0x6fa8ff,transparent:true,opacity:.25,depthWrite:false}));g.add(gl);g.scale.set(1.3,1.3,1.3);return g}
const coinG=new T.CylinderGeometry(.38,.38,.1,16),coinM=new T.MeshLambertMaterial({color:0xffc400,emissive:0x664400});
function truck(){const g=new T.Group();box(2.2,2.5,5,0xf5f5f5,0,1.9,.8,g);box(2.2,.5,5,[0x1e88e5,0xe53935,0x43a047][Math.random()*3|0],0,.9,.8,g);box(2.1,1.7,1.5,0xfb8c00,0,1.4,-2.7,g);box(1.8,.7,.1,0xaee3ff,0,1.8,-3.47,g);
 [-1.1,1.1].forEach(x=>[-2.6,0,1.9,3].forEach(z=>{const w=cyl(.45,.45,.3,0x222222,x,.45,z);w.rotation.z=Math.PI/2;g.add(w)}));return g}
function cones(){const g=new T.Group();[-.8,0,.8].forEach(x=>{g.add(cyl(.05,.3,.8,0xff6d00,x,.4,0,10));g.add(cyl(.12,.2,.2,0xffffff,x,.4,0,10))});return g}
function addObs(type,lane,z,v=0){const g=type=='truck'?truck():type=='cone'?cones():type=='low'?barrier():type=='high'?bar():car();
 if(type=='slow')g.rotation.y=Math.PI;
 g.position.set(LANES[lane],0,z);scene.add(g);items.push({g,type:type=='oncoming'||type=='slow'?'car':type,lane,z,v,hl:type=='truck'?4:type=='cone'||type=='low'?.5:2});}
function addBadge(lane,z){const g=badge();g.position.set(LANES[lane],1.3,z);scene.add(g);items.push({g,type:"badge",lane,z,y:1.3})}
function addCoin(lane,z,y=.9){const m=new T.Mesh(coinG,coinM);m.rotation.z=Math.PI/2;m.position.set(LANES[lane],y,z);scene.add(m);items.push({g:m,type:'coin',lane,z,y});}

// ---------- ИГРА ----------
let music=$('music'),introT=0,camZ=4.6,turnY=0,prevAir=false,landT=0,st='menu',speed,dist,coins,score,lane,px,py,vy,sliding,slideT,nextSpawn,runT,best=0,deadT;
try{best=+localStorage.cyp||0}catch(e){}
function reset(){try{stopBonus()}catch(e){};items.forEach(i=>scene.remove(i.g));items.length=0;speed=14;dist=0;coins=0;score=0;lane=1;px=0;py=0;vy=0;sliding=false;slideT=0;nextSpawn=-30;runT=0;deadT=0;body.rotation.set(0,0,0);body.position.y=0;body.scale.set(1,1,1)}
function spawn(){const z=nextSpawn;if(bonusT<=0&&Math.random()<.12&&!items.some(o=>o.type=='badge'))addBadge(Math.random()*3|0,z-9);const r=Math.random(),l=Math.random()*3|0,l2=(l+1+(Math.random()*2|0))%3,free=[0,1,2].filter(i=>i!=l&&i!=l2);
 const line=(ln,n,y)=>{for(let k=0;k<n;k++)addCoin(ln,z-k*2,y)};
 if(r<.14){addObs('car',l,z);if(Math.random()<.5)addObs('car',l2,z);line(free[0],6)}
 else if(r<.30){addObs('oncoming',l,z-20,12);if(Math.random()<.4)addObs('oncoming',l2,z-35,12);line(free[0],5)}
 else if(r<.40){addObs('slow',l,z,-8);line(free[0],5)}
 else if(r<.50){addObs('truck',l,z-4,-4);line(free[0],5)}
 else if(r<.64){addObs('low',l,z);if(Math.random()<.4)addObs('cone',l2,z);for(let k=-2;k<=2;k++)addCoin(l,z+k*1.6,1.1+(2-Math.abs(k))*.35)}
 else if(r<.74){addObs('cone',l,z);addObs('cone',l,z-3);for(let k=-2;k<=2;k++)addCoin(l,z-1.5+k*1.6,1.2+(2-Math.abs(k))*.3)}
 else if(r<.88){addObs('high',l,z);if(Math.random()<.5)addObs('car',l2,z);for(let k=0;k<4;k++)addCoin(l,z+k*1.5,.6)}
 else{const n=8+(Math.random()*6|0);line(l,n)}
 nextSpawn-=16+Math.random()*10+speed*.35}
const bs=$('bsong');let bonusT=0;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200)}
function startBonus(){bonusT=26;outfit.visible=true;outfit.scale.set(.1,.1,.1);$('bon').classList.remove('hidden');bs.muted=false;bs.currentTime=0;const pp=bs.play();if(pp&&pp.then)pp.then(()=>music.pause()).catch(()=>{});else music.pause();toast('👮 ×2 МОНЕТЫ!');chirp(2,.15)}
function stopBonus(){const was=bonusT>0||outfit.visible;bonusT=0;outfit.visible=false;bs.pause();$('bon').classList.add('hidden');if(was){music.play().catch(()=>{});setTimeout(()=>{if(music.paused&&bonusT<=0)music.play().catch(()=>{})},300)}}
let AC=null;function chirp(n=2,vol=.12){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();for(let i=0;i<n;i++){const t=AC.currentTime+i*.13,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(2300+Math.random()*300,t);o.frequency.exponentialRampToValueAtTime(3400,t+.07);o.frequency.exponentialRampToValueAtTime(2400,t+.1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.12)}}catch(e){}}
let chirpT=4;
function unlockBs(){chirp(0);try{bs.muted=true;const p=bs.play();const done=()=>{bs.pause();bs.currentTime=0;bs.muted=false};if(p&&p.then)p.then(done).catch(()=>{bs.muted=false});else done()}catch(e){}}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{if(bonusT>0&&bs.paused){bs.muted=false;bs.play().catch(()=>{})}if(bonusT<=0&&music.paused&&st!='menu')music.play().catch(()=>{})},{passive:true}));
bs.addEventListener('ended',()=>{if(bonusT>0)stopBonus()});
function die(){stopBonus();st='dead';deadT=0;const sc=Math.floor(score);if(sc>best){best=sc;try{localStorage.cyp=best}catch(e){}}
 $('fs').textContent=sc;$('fc').textContent=coins;$('best').textContent=best;setTimeout(()=>{$('over').classList.remove('hidden');$('hud').classList.add('hidden')},700)}
function left(){if(st=='run'&&lane>0)lane--}function right(){if(st=='run'&&lane<2)lane++}
function jump(){if(st=='run'&&py<.05){vy=11;sliding=false;chirp(1,.1)}}function slide(){if(st!='run')return;if(py>.05)vy=-16;sliding=true;slideT=.7}
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')left();if(k=='ArrowRight'||k=='d')right();if(k=='ArrowUp'||k=='w'||k==' ')jump();if(k=='ArrowDown'||k=='s')slide()});
let tx,ty;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<24)jump();else if(Math.abs(dx)>Math.abs(dy))dx<0?left():right();else dy<0?jump():slide();tx=null},{passive:true});
function begin(){reset();st='intro';introT=0;$('menu').classList.add('hidden');$('over').classList.add('hidden');$('hud').classList.add('hidden');unlockBs();const m=$('music');if(typeof stopBonus=='function')stopBonus();m.currentTime=0;m.play().catch(()=>{})}
$('start').onclick=begin;$('again').onclick=begin;
reset();

let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 birds.forEach(b=>{const w=Math.sin(now/110+b.userData.o)*.6;b.userData.a.rotation.z=w;b.userData.b.rotation.z=-w});
 clouds.forEach(c=>{c.position.x+=dt*1.5;if(c.position.x>90)c.position.x=-90});
 if(st=='intro'){introT+=dt;if(introT>1.7){st='run';$('hud').classList.remove('hidden')}}
 if(st=='run'){
  speed=Math.min(34,14+dist/60);dist+=speed*dt;score+=speed*dt*.5;runT+=dt*speed*.55;
  px+=(LANES[lane]-px)*Math.min(1,dt*14);
  vy-=32*dt;py+=vy*dt;if(py<0){py=0;vy=0}
  if(sliding){slideT-=dt;if(slideT<=0)sliding=false}
  const ph=sliding&&py<.05?.6:1.4;
  // движение мира
  const mv=speed*dt;
  dashes.forEach(d=>{d.position.z+=mv;if(d.position.z>10)d.position.z-=320});
  deco.forEach(d=>{d.position.z+=mv+(d.userData.v||0)*dt;if(d.position.z>14){d.position.z-=200+Math.random()*10}});
  birds.forEach(b=>{b.position.z+=mv-4*dt;b.position.x+=dt*2;if(b.position.z>20){b.position.z-=170;b.position.x=(Math.random()-.5)*60}});
  nextSpawn+=mv;while(nextSpawn>-150)spawn();
  for(let i=items.length-1;i>=0;i--){const o=items[i];o.z+=mv+(o.v||0)*dt;o.g.position.z=o.z;
   if(o.type=='coin'||o.type=='badge'){o.g.rotation.y+=dt*5;if(o.type=='badge'){const p=1.3+Math.sin(now/150)*.1;o.g.scale.set(p,p,p)}if(Math.abs(o.z)<.9&&Math.abs(LANES[o.lane]-px)<1&&Math.abs(o.y-(py+.7))<1.2){if(o.type=='badge')startBonus();else{const m=bonusT>0?2:1;coins+=m;score+=10*m;chirp(1,.05)}scene.remove(o.g);items.splice(i,1);continue}}
   else if(Math.abs(o.z)<o.hl+.35&&Math.abs(LANES[o.lane]-px)<.95){
    const hit=o.type=='car'?py<1.7:o.type=='truck'?py<2.8:(o.type=='low'||o.type=='cone')?py<.85:!(sliding&&py<.05);
    if(hit){die()}}
   if(o.z>10){scene.remove(o.g);items.splice(i,1)}}
  chirpT-=dt;if(chirpT<=0){chirpT=6+Math.random()*6;chirp(2,.1)}
  if(bonusT>0){if(!bs.paused&&isFinite(bs.duration))bonusT=Math.max(.05,bs.duration-bs.currentTime);else bonusT-=dt;$('bt').textContent=Math.max(0,Math.ceil(bonusT));if(bonusT<=0)stopBonus()}
  $('dist').textContent=Math.floor(dist);$('coins').textContent=coins;$('score').textContent=Math.floor(score);
 }
 if(st=='dead'){deadT+=dt;body.rotation.x=Math.min(deadT*5,1.5);body.position.y=Math.max(0,.2-deadT*.3);wingL.rotation.x=wingR.rotation.x=-2.5;legs.forEach(l=>{l.rotation.x=.5;l.knee.rotation.x=0})}
 else{const sw=Math.sin(runT*1.7),cs=Math.cos(runT*1.7),air=py>.05,run=st=='run';
  const tgt=run||(st=='intro'&&introT>1.05)?Math.PI:0;turnY+=(tgt-turnY)*Math.min(1,dt*7);
  if(prevAir&&!air){landT=.22}prevAir=air;landT=Math.max(0,landT-dt);
  const lean=(LANES[lane]-px);
  chick.position.set(px,py,0);blob.position.set(px,.03,0);const sc=Math.max(.4,1-py*.25);blob.scale.set(sc,sc,sc);
  model.rotation.set(0,turnY+(run?lean*.18:0),run?-lean*.12:0);
  let sy=1,sxz=1,by=0,tilt=0;
  if(run){
   if(sliding&&!air){tilt=.95;by=-.15;sy=.9}
   else if(air){sy=vy>0?1.1:1.02;sxz=1/Math.sqrt(sy);tilt=vy>0?.08:-.1}
   else{by=Math.abs(sw)*.1;tilt=.1+(speed-14)*.004;sy=1+cs*.025;sxz=1-cs*.015}
   if(landT>0){const k=Math.sin(landT/.22*Math.PI);sy*=1-.22*k;sxz*=1+.14*k}}
  body.position.y=by;body.rotation.x=tilt;body.scale.set(sxz,sy,sxz);body.rotation.z=run?Math.sin(runT*1.7)*.05:0;
  face.visible=!run||turnY<2.9;
  if(run&&!(sliding&&!air)){const ph=runT*1.7,a=air?0:Math.sin(ph),c=Math.cos(ph);
   legs[0].rotation.x=air?-.8:a*1.0;legs[1].rotation.x=air?.4:-a;
   legs[0].knee.rotation.x=air?.3:Math.max(0,-c)*1.4;legs[1].knee.rotation.x=air?1.3:Math.max(0,c)*1.4;
   legs.forEach(l=>l.foot.rotation.x=-l.rotation.x*.25-l.knee.rotation.x*.2);
   wingL.rotation.x=air?-2.7:-a*.9;wingR.rotation.x=air?-2.7:a*.9;wingL.rotation.z=air?-.3:-.12;wingR.rotation.z=air?.3:.12;wingL.el.rotation.x=wingR.el.rotation.x=air?-.3:-1.1}
  else if(run){legs.forEach(l=>{l.rotation.x=-1.3;l.knee.rotation.x=.3;l.foot.rotation.x=.2});wingL.rotation.x=wingR.rotation.x=1.1;wingL.rotation.z=-.3;wingR.rotation.z=.3;wingL.el.rotation.x=wingR.el.rotation.x=-.3}
  else{legs.forEach(l=>{l.rotation.x=0;l.knee.rotation.x=0;l.foot.rotation.x=0});wingL.rotation.x=wingR.rotation.x=0;wingL.rotation.z=-.12;wingL.el.rotation.x=-.15;wingR.el.rotation.x=0;wingR.rotation.z=2.5+Math.sin(now/170)*.35;body.position.y=Math.abs(Math.sin(now/500))*.03;model.rotation.y=turnY+Math.sin(now/900)*.25*Math.max(0,1-turnY/2)}}
 if(outfit.visible){const q=Math.min(1,outfit.scale.x+dt*5);outfit.scale.set(q,q,q)}
 const kz=st=='run'||st=='dead'?1:0;camZ+=((kz?6.5:4.6)-camZ)*Math.min(1,dt*3);const k=(camZ-4.6)/1.9;cam.position.set(px*.55,2.4+1.8*k+py*.25,camZ);cam.lookAt(px*.3,1.1+.2*k,-8*k);
 renderer.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
